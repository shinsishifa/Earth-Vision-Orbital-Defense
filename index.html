<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Earth Vision: Orbital Defense</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #020208;
      color: #00f0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
      padding: 10px;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 12, 28, 0.85);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .hud span {
      color: #ff0055;
      font-size: 1.1rem;
    }
    canvas {
      background: radial-gradient(circle at center, #060c20 0%, #010206 100%);
      border: 2px solid #00f0ff;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      display: block;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      top: 65px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: rgba(3, 4, 12, 0.9);
      border: 1px solid #ff0055;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(4px);
    }
    .overlay h1 {
      font-size: 2.2rem;
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff, 0 0 20px #ff0055;
      margin-bottom: 10px;
    }
    .overlay p {
      color: #cccccc;
      margin-bottom: 20px;
      font-size: 0.95rem;
      padding: 0 15px;
    }
    .btn {
      background: transparent;
      color: #ff0055;
      border: 2px solid #ff0055;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
      transition: all 0.2s ease-in-out;
    }
    .btn:hover {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
      transform: scale(1.05);
    }
    .hidden {
      display: none !important;
    }
    .instructions {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #606080;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="hud">
      <div>Score: <span id="scoreDisplay">0</span></div>
      <div>EARTH VISION</div>
      <div>Shield: <span id="shieldDisplay">100%</span></div>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div id="startScreen" class="overlay">
      <h1>EARTH VISION</h1>
      <p>Rotate your orbital defense shield to intercept falling meteors and protect Earth!</p>
      <button class="btn" onclick="startGame()">Deploy Shield</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h1>PLANETARY IMPACT</h1>
      <p id="overText">Score: 0</p>
      <button class="btn" onclick="startGame()">Re-Deploy</button>
    </div>

    <div class="instructions">Controls: Move Mouse / Touch & Drag around Earth to Rotate Shield</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreDisplay = document.getElementById('scoreDisplay');
    const shieldDisplay = document.getElementById('shieldDisplay');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const overText = document.getElementById('overText');

    const center = { x: canvas.width / 2, y: canvas.height / 2 };
    const earthRadius = 65;
    const orbitRadius = 120;

    let shieldAngle = 0;
    let shieldArc = Math.PI / 3; // 60 degrees arc width
    let earthHealth = 100;
    let score = 0;
    let gameRunning = false;
    let animationId;
    let frameCount = 0;

    let meteors = [];
    let particles = [];
    let stars = [];

    // Initialize stars background
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5,
        alpha: Math.random()
      });
    }

    function drawEarth() {
      // Atmosphere Glow
      ctx.beginPath();
      ctx.arc(center.x, center.y, earthRadius + 12, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
      ctx.fill();

      // Earth Body
      ctx.beginPath();
      ctx.arc(center.x, center.y, earthRadius, 0, Math.PI * 2);
      let earthGrad = ctx.createRadialGradient(
        center.x - 20, center.y - 20, 10,
        center.x, center.y, earthRadius
      );
      earthGrad.addColorStop(0, '#00d2ff');
      earthGrad.addColorStop(0.7, '#0040aa');
      earthGrad.addColorStop(1, '#001040');
      ctx.fillStyle = earthGrad;
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00f0ff';
      ctx.fill();
      ctx.shadowBlur = 0;

      // Continental details (dynamic rotating lines)
      ctx.strokeStyle = 'rgba(0, 255, 120, 0.4)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(center.x - 15, center.y - 10, 25, 0.5, 3.5);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(center.x + 20, center.y + 15, 18, 2, 5);
      ctx.stroke();
    }

    function drawShield() {
      ctx.beginPath();
      ctx.arc(center.x, center.y, orbitRadius, shieldAngle - shieldArc / 2, shieldAngle + shieldArc / 2);
      ctx.strokeStyle = '#00ff66';
      ctx.lineWidth = 6;
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ff66';
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function spawnMeteor() {
      if (frameCount % Math.max(20, 60 - Math.floor(score / 40)) === 0) {
        const spawnAngle = Math.random() * Math.PI * 2;
        const distance = canvas.width / 2 + 30;
        
        meteors.push({
          x: center.x + Math.cos(spawnAngle) * distance,
          y: center.y + Math.sin(spawnAngle) * distance,
          speed: 1.8 + Math.random() * 1.5 + score / 250,
          radius: 6 + Math.random() * 6,
          angle: spawnAngle
        });
      }
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 1.0,
          color: color
        });
      }
    }

    function updateMeteors() {
      for (let i = meteors.length - 1; i >= 0; i--) {
        let m = meteors[i];
        
        // Move towards center (Earth)
        let dx = center.x - m.x;
        let dy = center.y - m.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        m.x += (dx / dist) * m.speed;
        m.y += (dy / dist) * m.speed;

        // Draw Meteor
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff0055';
        ctx.fill();
        ctx.shadowBlur = 0;

        // Check Shield Collision
        if (Math.abs(dist - orbitRadius) < m.speed + 4) {
          let meteorAngle = Math.atan2(m.y - center.y, m.x - center.x);
          
          // Normalize angles for comparison
          let diff = Math.atan2(Math.sin(meteorAngle - shieldAngle), Math.cos(meteorAngle - shieldAngle));

          if (Math.abs(diff) <= shieldArc / 2) {
            createExplosion(m.x, m.y, '#00ff66');
            meteors.splice(i, 1);
            score += 10;
            scoreDisplay.innerText = score;
            continue;
          }
        }

        // Check Earth Collision
        if (dist <= earthRadius + m.radius) {
          createExplosion(m.x, m.y, '#ff0055');
          meteors.splice(i, 1);
          earthHealth -= 20;
          shieldDisplay.innerText = `${Math.max(0, earthHealth)}%`;

          if (earthHealth <= 0) {
            endGame();
          }
        }
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    function drawStars() {
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = s.alpha;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1.0;
    }

    function update() {
      if (!gameRunning) return;
      frameCount++;
      spawnMeteor();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawStars();
      drawEarth();
      drawShield();
      updateMeteors();
      updateParticles();
    }

    function gameLoop() {
      update();
      draw();
      if (gameRunning) animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      score = 0;
      earthHealth = 100;
      frameCount = 0;
      meteors = [];
      particles = [];

      scoreDisplay.innerText = score;
      shieldDisplay.innerText = '100%';

      gameRunning = true;
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');

      cancelAnimationFrame(animationId);
      gameLoop();
    }

    function endGame() {
      gameRunning = false;
      cancelAnimationFrame(animationId);
      overText.innerText = `Final Defense Score: ${score}`;
      gameOverScreen.classList.remove('hidden');
    }

    // Pointer Input (Mouse / Touch Rotation)
    function handlePointer(e) {
      if (!gameRunning) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const x = clientX - rect.left - center.x;
      const y = clientY - rect.top - center.y;

      shieldAngle = Math.atan2(y, x);
    }

    canvas.addEventListener('mousemove', handlePointer);
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handlePointer(e);
    }, { passive: false });
  </script>
</body>
</html>
